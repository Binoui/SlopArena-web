services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - feedback
    restart: unless-stopped

  feedback:
    build:
      context: .
      target: feedback
    volumes:
      - feedback-data:/data
    restart: unless-stopped

volumes:
  feedback-data:
